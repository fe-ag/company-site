{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ site.tagline }}{% endblock %}">
    <style>{{ theme_css|safe }}</style>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include 'shared/header.html' %}
<main id="main">
    {% if messages %}
    <div class="container">
        {% for message in messages %}<div class="flash flash-{{ message.tags }}" role="status">{{ message }}</div>{% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
{% include 'shared/footer.html' %}
<script src="{% static 'js/site.js' %}"></script>
</body>
</html>
