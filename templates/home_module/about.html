{% extends 'base.html' %}
{% block title %}{{ site.about_title }} | {{ site.site_name }}{% endblock %}
{% block content %}
<section class="section page-head"><div class="container"><h1>{{ site.about_title }}</h1></div></section>
<section class="section">
    <div class="container split">
        <div class="prose">{{ site.about_text|linebreaks }}</div>
        {% if site.about_image %}<div><img class="intro-img" src="{{ site.about_image.url }}" alt="{{ site.about_title }}"></div>{% endif %}
    </div>
</section>
{% endblock %}
